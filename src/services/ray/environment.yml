channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - pip
  - git
  - pip:
    - pip
    - setuptools
    - nnsight
    - ray[serve]==2.45.0
    - python-slugify
    # Telemetry
    - prometheus_client
    - python-logging-loki
    # Database
    - boto3
    - influxdb-client
  # PyTorch with Apple Silicon MPS support
  - pytorch>=2.0.0
  - torchvision
  - torchaudio
